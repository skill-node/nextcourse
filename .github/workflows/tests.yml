name: Tests

on:
  push:
    branches:
      - main
      - codex/lego-modularity-core
      - codex/studio-ui
  pull_request:
    branches:
      - main
      - codex/lego-modularity-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm test
      - run: git diff --check
