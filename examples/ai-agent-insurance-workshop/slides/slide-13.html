<section>
  <h2>条款翻译也一样</h2>
  <div class="prompt-compare">
    <div class="prompt-compare__col prompt-compare__col--before animate-fade-left">
      <div class="prompt-compare__label">❌ 含糊版</div>
      <p class="prompt-compare__text">把这段条款解释一下。</p>
      <div class="prompt-compare__verdict">解释给谁听？多细？能不能改口径？全没交代</div>
    </div>
    <div class="prompt-compare__col prompt-compare__col--after animate-fade-right">
      <div class="prompt-compare__label">✅ 改后</div>
      <p class="prompt-compare__text">把下面这段免责条款讲给完全没有保险知识的客户听。用生活化的例子，不要出现专业术语，保留原文里的时间与比例数字不得改动，最后用一句话说明"什么情况下不赔"。输出：3 句话 + 1 个例子。</p>
      <div class="prompt-compare__verdict">「数字不得改动」这条约束，把最大的风险堵住了</div>
    </div>
  </div>
  <aside class="notes">
    重点讲右边那条约束：条款翻译最怕 AI 把比例和期限"顺手改顺了"。
    约束不是让输出更好看，是把风险堵住——这是保险人写提示词与别的行业最大的不同。
  </aside>
