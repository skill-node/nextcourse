<section>
  <h2>一条能用的指令，有五个零件</h2>
  <ol class="pill-list">
    <li class="animate-fade-up stagger-1">角色：让它站在谁的位置上说话</li>
    <li class="animate-fade-up stagger-2">对象：这段内容说给谁听</li>
    <li class="animate-fade-up stagger-3">目标：你要它产出什么结果</li>
    <li class="animate-fade-up stagger-4">约束：不能说什么、多长、什么口径</li>
    <li class="animate-fade-up stagger-5">格式：表格、清单、还是话术稿</li>
  </ol>
  <aside class="notes">
    五个零件不用背，现场让他们对照自己上周发过的指令数一数缺了几个。
    绝大多数人只写了"目标"，剩下四个全靠 AI 猜——猜错了怪 AI 笨。
  </aside>
</section>
