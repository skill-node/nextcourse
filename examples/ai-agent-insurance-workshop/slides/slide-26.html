<section>
  <h2>宣传文案的三条红线</h2>
  <ul class="check-list">
    <li class="animate-fade-up stagger-1">不承诺收益："保证""稳赚""零风险"</li>
    <li class="animate-fade-up stagger-2">不贬低同业，不做未经授权的产品对比</li>
    <li class="animate-fade-up stagger-3">报备口径 AI 不知道，务必回查公司文件</li>
  </ul>
  <div class="callout callout--warning animate-fade-up stagger-4">
    <span class="callout__icon">⚠️</span>
    <div class="callout__body">
      <span class="callout__title">最容易翻车的一句</span>
      AI 写的文案读起来最顺的那几句，往往正是踩线的那几句。
    </div>
  </div>
  <aside class="notes">
    第三条最容易被忽略：AI 不知道你司这款产品的报备口径，它会按常识补一个看起来合理的说法。
    所以 AI 出的文案必须回查公司文件，这不是流程，是底线。
  </aside>
</section>
