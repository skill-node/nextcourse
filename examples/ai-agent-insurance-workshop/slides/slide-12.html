<section>
  <h2>同一件事，两种问法</h2>
  <div class="prompt-compare">
    <div class="prompt-compare__col prompt-compare__col--before animate-fade-left">
      <div class="prompt-compare__label">❌ 上周发出去的</div>
      <p class="prompt-compare__text">客户说保费太贵了，帮我想想怎么回。</p>
      <div class="prompt-compare__verdict">没说客户是谁、没说产品、没说场合，出来的是万能套话</div>
    </div>
    <div class="prompt-compare__col prompt-compare__col--after animate-fade-right">
      <div class="prompt-compare__label">✅ 改后</div>
      <p class="prompt-compare__text">你是从业十年的保险顾问。客户是 35 岁企业中层，两个孩子，关注教育金，刚说"每年两万太贵了"。请给 3 段回应话术：先共情、再算长期成本、最后给一个可降档的方案。每段不超过 80 字，口语化，不承诺任何收益。</p>
      <div class="prompt-compare__verdict">角色、对象、目标、约束、格式全给齐，直接能用</div>
    </div>
  </div>
  <aside class="notes">
    这一页别念原文，让他们自己读 30 秒，然后问一句：右边多出来的是什么？
    答案就是那五个零件。这比讲师逐条讲解有效得多。
  </aside>
</section>
