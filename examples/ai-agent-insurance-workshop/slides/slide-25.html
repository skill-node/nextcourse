<section>
  <h2>客户信息，先分三级</h2>
  <table class="table-compare animate-fade-up">
    <thead>
      <tr>
        <th>级别</th>
        <th>包含什么</th>
        <th class="col--highlight">怎么处理</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>绝对不能出</td>
        <td>身份证号、银行卡、诊断细节、保单号</td>
        <td class="col--highlight">上传前遮挡或删除</td>
      </tr>
      <tr>
        <td>企业版内可处理</td>
        <td>姓名、联系方式、投保记录</td>
        <td class="col--highlight">只在公司采购的工具里用</td>
      </tr>
      <tr>
        <td>可自由使用</td>
        <td>产品条款、公开费率、宣传素材</td>
        <td class="col--highlight">随便用，注意报备口径</td>
      </tr>
    </tbody>
  </table>
  <aside class="notes">
    别念表格，直接进擂台。这一页是判断的标尺，学员真正记住它是在下一页动手分级的时候。
    有人问"公司还没采购企业版怎么办"——那第二级就当第一级处理，一律脱敏。
  </aside>
</section>
