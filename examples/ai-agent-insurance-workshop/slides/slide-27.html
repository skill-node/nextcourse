<section>
  <h2>擂台：这三份材料，怎么分级</h2>
  <div class="activity-card">
    <div class="activity-card__header animate-fade-up stagger-1">
      <span class="activity-card__badge">判断擂台</span>
      <h3 class="activity-card__title">现场给三份材料分级，并说出处理动作</h3>
      <span class="activity-card__timer">15 min</span>
    </div>
    <p class="activity-card__task animate-fade-up stagger-2">每组拿到同样三份材料：一张理赔结算单、一份客户名单、一段 AI 写的朋友圈文案。判断各属哪一级，说出上传前要做什么。</p>
    <div class="activity-card__meta animate-fade-up stagger-3">
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">分组</span>6 组抢答，每组限 90 秒
      </div>
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">交付物</span>材料脱敏检查清单
      </div>
    </div>
    <ul class="activity-card__criteria animate-fade-up stagger-4">
      <li>三份材料的级别判断全对</li>
      <li>说得出具体动作，不是"注意保密"</li>
      <li>文案那份要指出踩线的原句</li>
    </ul>
  </div>
  <aside class="notes">
    文案那份故意埋了两处：一句"保证收益"，一句拿同业产品做贬低对比。
    抢答形式，答错不扣分，但要让别组补充——补充比讲师纠正记得牢。
    这一段的产出就是结营考核 C 项的练手。
  </aside>
</section>
