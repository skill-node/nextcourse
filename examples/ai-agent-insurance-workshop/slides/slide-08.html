<section>
  <h2>练习：一件聊天框做不到的事</h2>
  <div class="activity-card">
    <div class="activity-card__header animate-fade-up stagger-1">
      <span class="activity-card__badge">两两互讲</span>
      <h3 class="activity-card__title">说出你工作里那件「聊天框帮不上忙」的事</h3>
      <span class="activity-card__timer">10 min</span>
    </div>
    <p class="activity-card__task animate-fade-up stagger-2">回想上周做过的一件材料整理工作，向同伴讲清楚：它卡在哪一步，为什么聊天框帮不了你。</p>
    <div class="activity-card__meta animate-fade-up stagger-3">
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">分组</span>结对，各讲 3 分钟
      </div>
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">交付物</span>判断卡上写下 1 条
      </div>
    </div>
    <ul class="activity-card__criteria animate-fade-up stagger-4">
      <li>说得出卡在哪一步，不是笼统的「太麻烦」</li>
      <li>说得出它为什么接不住：要读文件？要批量？</li>
    </ul>
  </div>
  <aside class="notes">
    交代任务 → 交代时间（计时器可见）→ 结对 → 交代交付物与评分点 → 抽 2 组分享。
    他们自己举的例子比讲师给的更有说服力，所以这一段别抢话。
    听到好例子当场记下来，下午实操选题可以直接用。
  </aside>
</section>
