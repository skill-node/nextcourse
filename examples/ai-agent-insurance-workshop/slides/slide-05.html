<section>
  <h2>发动机与整车</h2>
  <div class="concept-card animate-fade-up">
    <h3 class="concept-card__term">办公智能体 (AI Agent)</h3>
    <p class="concept-card__def">
      在大模型之上，加了记忆、工具和执行权限的一整套系统，能读文件、能调工具、能产出成品文件。
    </p>
    <div class="concept-card__example">
      <strong>示例：</strong>大模型是发动机，聊天框是把发动机接上话筒，智能体是把发动机装进整车——你说去哪，它自己跑。
    </div>
  </div>
  <aside class="notes">
    这一页 10 分钟内讲完。台下都是用过聊天 AI 的老手，从零讲概念他们会走神。
    重点只有一句：差别不在"聪不聪明"，在"有没有手"。
  </aside>
</section>
