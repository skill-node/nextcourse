<section>
  <h2>它为什么聊着聊着就忘了</h2>
  <div class="concept-card animate-fade-up stagger-1">
    <h3 class="concept-card__term">上下文窗口</h3>
    <p class="concept-card__def">
      模型一次能"看见"的文字有上限，超出的部分会被挤出去，所以长对话到后面它会忘记开头的交代。
    </p>
  </div>
  <div class="callout callout--tip animate-fade-up stagger-2">
    <span class="callout__icon">💡</span>
    <div class="callout__body">
      <span class="callout__title">实用推论</span>
      重要的约束别只在开头说一次；任务换了，就开新对话，别在一个窗口里聊到底。
    </div>
  </div>
  <aside class="notes">
    先摆现象再给概念——现场问一句"谁遇到过它前后说法不一致"，一半人会举手。
    这一页的落点是操作习惯，不是原理：换任务就换对话。
  </aside>
</section>
