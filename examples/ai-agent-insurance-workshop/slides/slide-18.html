<section>
  <div class="case-study">
    <div class="case-study__header">
      <span class="tag">场景 01</span>
      <h3 class="case-study__title">条款白话解读</h3>
    </div>
    <div class="case-study__body">
      <div class="case-study__panel animate-fade-up stagger-1">
        <span class="case-study__panel-label">原来怎么做</span>
        <p>客户问免责条款，翻 PDF 找到那一页，手打或截图发过去，客户还是看不懂。</p>
      </div>
      <div class="case-study__panel animate-fade-up stagger-2">
        <span class="case-study__panel-label">卡在哪</span>
        <p>聊天框要先把条款一段段贴进去，贴多了它又记不住，每个客户都得重来一遍。</p>
      </div>
      <div class="case-study__panel case-study__panel--outcome animate-fade-up stagger-3">
        <span class="case-study__panel-label">智能体怎么做</span>
        <p>整份条款丢给它读一次，之后按客户情况随时出白话版，数字不动，一句话说明不赔的情形。</p>
      </div>
    </div>
  </div>
  <aside class="notes">
    这是 agent 含量最低的场景，放第一个是因为成功率最高，第一次尝试就成功很重要。
    落点：能直接读文件，且可复用——这两件事聊天框都做不到。
  </aside>
</section>
