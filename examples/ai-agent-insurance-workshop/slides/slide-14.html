<section>
  <h2>练习：改写你自己的提示词</h2>
  <div class="activity-card">
    <div class="activity-card__header animate-fade-up stagger-1">
      <span class="activity-card__badge">动手练习</span>
      <h3 class="activity-card__title">把你上周真实发过的一条指令改成五要素版</h3>
      <span class="activity-card__timer">30 min</span>
    </div>
    <p class="activity-card__task animate-fade-up stagger-2">翻出手机里上周问 AI 的记录，挑一条不满意的，用五要素重写，两版都跑一遍，把结果贴在一起对比。</p>
    <div class="activity-card__meta animate-fade-up stagger-3">
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">分组</span>个人 20 分钟，同桌互评 10 分钟
      </div>
      <div class="activity-card__meta-item">
        <span class="activity-card__meta-label">交付物</span>提示词卡 3 条
      </div>
    </div>
    <ul class="activity-card__criteria animate-fade-up stagger-4">
      <li>五要素齐全，缺一个就算没达标</li>
      <li>约束写得具体到可验收，不是「写好一点」</li>
      <li>两版输出的差别，你能说出来</li>
    </ul>
  </div>
  <aside class="notes">
    必须用他们自己的真实指令，给的例子他们改起来没感觉。
    互评环节只问一句话：这条指令给你，你能照着写出他要的东西吗？
    答不上来就说明还有零件没给。中途 10 分钟处巡场一次。
  </aside>
</section>
