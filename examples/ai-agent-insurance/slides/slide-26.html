<section>
  <h2>哪些客户信息不能往外发</h2>
  <div class="vs-box vs-box--columns">
    <div class="vs-bad animate-fade-left">
      <h3>🚫 绝对不发</h3>
      <ul>
        <li>身份证号、银行卡号</li>
        <li>完整诊断结论</li>
        <li>保单号加姓名</li>
      </ul>
    </div>
    <div class="vs-neutral animate-fade-up">
      <h3>✂️ 处理后再发</h3>
      <ul>
        <li>发票：遮住人和病，留金额</li>
        <li>病历：只留你要问的那段</li>
        <li>客户名：用"某先生"代替</li>
      </ul>
    </div>
    <div class="vs-good animate-fade-right">
      <h3>✅ 放心用</h3>
      <ul>
        <li>公开的条款和产品资料</li>
        <li>不带客户信息的话术</li>
        <li>你自己写的内容</li>
      </ul>
    </div>
  </div>
  <aside class="notes">
    不要讲成规定，讲成逻辑——回到模块一那张"你打的字去了哪里"。
    它会离开你的电脑，所以判断标准很简单：
    这条信息如果传到外面，会不会伤到客户？
    中间这一栏是最实用的，因为大部分工作不是"不能做"，是"处理一下再做"。
    遮挡这个动作只要十几秒，但它把风险几乎清零了。
  </aside>
</section>
