<section>
  <h2>对比②：把条款讲成人话</h2>
  <div class="vs-box vs-box--columns">
    <div class="vs-bad animate-fade-left">
      <h3>❌ 改前</h3>
      <ul>
        <li>"解释一下这个条款"</li>
        <li>结果：把条款换个说法又抄一遍</li>
        <li>客户还是听不懂，你还得再翻译</li>
      </ul>
    </div>
    <div class="vs-good animate-fade-right">
      <h3>✅ 改后</h3>
      <ul>
        <li>角色：作为常年处理理赔的资深顾问进行回复</li>
        <li>对象：55 岁客户，没有保险基础</li>
        <li>目标：讲清什么能赔、什么不赔、为什么不赔</li>
        <li>约束：不许用术语，要举生活例子</li>
        <li>格式：三句话，一句一个意思</li>
      </ul>
    </div>
  </div>
  <aside class="notes">
    这一页重点讲"对象"：同一个条款，讲给 55 岁客户和讲给同业新人，
    是两份完全不同的稿子。不说对象，AI 只能按平均值写，谁看都别扭。
    "不许用术语"这类否定式约束特别有效，可以让学员当场记下来。
  </aside>
</section>
