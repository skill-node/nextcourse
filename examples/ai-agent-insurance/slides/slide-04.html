<section>
  <h2>三层关系：发动机 · 整车 · 你的车</h2>
  <div class="icon-card-grid">
    <div class="icon-card animate-fade-up stagger-1">
      <div class="icon-card__icon primary">⚙️</div>
      <h3>大模型</h3>
      <p>发动机。会思考，但装不上就开不走</p>
    </div>
    <div class="icon-card animate-fade-up stagger-2">
      <div class="icon-card__icon accent">🚗</div>
      <h3>智能体</h3>
      <p>整车。有手有脚，能真的跑起来</p>
    </div>
    <div class="icon-card animate-fade-up stagger-3">
      <div class="icon-card__icon secondary">🔑</div>
      <h3>WorkBuddy</h3>
      <p>你买的那辆车。今天要开的就是它</p>
    </div>
  </div>
  <aside class="notes">
    发动机再强，没装成车，也送不了一个客户回家。
    这个比喻要讲透，后面所有内容都挂在它上面。
    大模型（DeepSeek、豆包背后的那个东西）只负责"想"；
    智能体是把这个"想"装进了能读文件、能发消息、能生成表格的车身里。
    你在网页上跟 AI 聊天，等于坐在一台放在地上的发动机旁边跟它说话——它很聪明，但它动不了。
  </aside>
