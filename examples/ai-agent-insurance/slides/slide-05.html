<section>
  <h2>它为什么聊着聊着就忘了</h2>
  <div class="concept-card animate-fade-up stagger-1">
    <h3 class="concept-card__term">上下文窗口（Context）</h3>
    <p class="concept-card__def">
      AI 每次能"同时看见"的文字量是有上限的。超出的部分会被挤出去，它就真的看不见了。
    </p>
    <div class="concept-card__example">
      <strong>示例：</strong>你贴进 20 页条款，聊到后半段它开始胡说——不是它笨，是前面那几页已经被挤出它的视线了。
    </div>
  </div>
  <div class="callout callout--tip animate-fade-up stagger-2">
    <span class="callout__icon">💡</span>
    <div class="callout__body">
      <span class="callout__title">怎么办</span>
      长材料分段问，一段问完再问下一段；重要前提在新问题里再说一遍。
    </div>
  </div>
  <aside class="notes">
    现场提问：有谁遇到过 AI 前后说法不一致、或者忘了你刚交代过的事？基本上都会举手。
    不用讲 token 的技术定义，讲清"它有视线范围"就够了。
    这一页解决的是学员最高频的挫败感来源。
  </aside>
</section>
