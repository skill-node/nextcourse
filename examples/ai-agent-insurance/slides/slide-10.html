<section>
  <h2>提示词五要素</h2>
  <ol class="pill-list">
    <li class="animate-fade-up stagger-1">角色：让它站在谁的位置上说话 【你是谁】</li>
    <li class="animate-fade-up stagger-2">对象：这段话是讲给谁听的 【针对谁】</li>
    <li class="animate-fade-up stagger-3">目标：你要的到底是什么结果 【1、2、3清晰指令】</li>
    <li class="animate-fade-up stagger-4">约束：哪些话不能说、不能碰 【注意事项】</li>
    <li class="animate-fade-up stagger-5">格式：几段、多长、什么样子</li>
  </ol>
  <div class="highlight-box animate-fade-up stagger-6">
    五条里最常漏的是"对象"和"约束"。
  </div>
  <aside class="notes">
    让学员拿手机拍下这一页，后面三页都要拿它对照。
    重点提醒漏掉那两条的后果：
    漏了对象，话术谁都能用，等于谁都用不上；
    漏了约束，AI 很容易写出你根本不能发出去的东西。
  </aside>
</section>
