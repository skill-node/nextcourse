<section>
  <h2>场景①：把条款读懂，读快</h2>
  <div class="case-study">
    <div class="case-study__body">
      <div class="case-study__panel animate-fade-up stagger-1">
        <span class="case-study__panel-label">你的日常</span>
        <p>客户问一句"这个能不能赔"，你要翻几十页条款，还怕看漏。</p>
      </div>
      <div class="case-study__panel animate-fade-up stagger-2">
        <span class="case-study__panel-label">聊天框的极限</span>
        <p>能答，但每次都要你手动把条款贴一遍，下次还得再贴一遍。</p>
      </div>
      <div class="case-study__panel case-study__panel--outcome animate-fade-up stagger-3">
        <span class="case-study__panel-label">智能体怎么做</span>
        <p>条款文件直接挂上去，当作个人资料库，让AI随时查看。</p>
      </div>
    </div>
  </div>
  <aside class="notes">
    这是五个场景里"非它不可"程度最低的一个，先热身。
    差别不在能不能答，在于"要不要每次重来"——这就是能挂知识库和不能挂的区别。
    可以问一句：你们组里是不是每个人都在自己电脑上存了一份条款？
  </aside>
</section>
